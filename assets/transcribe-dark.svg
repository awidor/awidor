<text x="56" y="304" font-family="p-mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" fill="#9198a1" letter-spacing="1.5">RUST<tspan fill="#5d6570">  ·  </tspan>TAURI<tspan fill="#5d6570">  ·  </tspan>WINDOWS + MACOS</text>
