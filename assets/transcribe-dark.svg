<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d"><title id="t">Transcribe</title><desc id="d">Transcribe, a desktop dictation app built with Rust and Tauri for Windows and macOS. Press a shortcut, talk, and clean text lands in any app. Shows the recording pill above a text field where the dictated sentence has been inserted.</desc><style>@font-face{font-family:p-display;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:p-text;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:p-mono;src:url(data:font/woff2;base64,) format('woff2')}</style><rect x="0.5" y="0.5" width="1279" height="359" rx="16" fill="#151b23" stroke="#262d37"/>
<text x="56" y="74" font-family="p-mono, ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" fill="#9198a1" letter-spacing="1.5"><tspan fill="#4493f8">01</tspan><tspan fill="#5d6570">  /  </tspan>DESKTOP DICTATION</text>
<text x="53" y="148" font-family="p-display, Inter, -apple-system, 'Segoe UI', sans-serif" font-size="58" fill="#e6edf3" letter-spacing="-1.6">Transcribe</text>
